<!doctype html>
<html lang="es" class="h-full bg-slate-100">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PokéPlay SPA</title>
    <script>
      window.tailwind = {
        config: {
          darkMode: 'class',
          theme: {
            extend: {
              keyframes: {
                float: {
                  '0%, 100%': { transform: 'translateY(0)' },
                  '50%': { transform: 'translateY(-6px)' }
                },
                pulseIn: {
                  '0%': { opacity: '0', transform: 'scale(0.96)' },
                  '100%': { opacity: '1', transform: 'scale(1)' }
                }
              },
              animation: {
                float: 'float 2.2s ease-in-out infinite',
                pulseIn: 'pulseIn .35s ease-out'
              }
            }
          }
        }
      };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body class="h-full text-slate-800 dark:bg-slate-900 dark:text-slate-100">
    <div class="min-h-full bg-gradient-to-b from-sky-100 to-white dark:from-slate-900 dark:to-slate-800">
      <header class="sticky top-0 z-20 border-b border-slate-200/70 bg-white/80 backdrop-blur dark:border-slate-700 dark:bg-slate-900/80">
        <div class="mx-auto flex max-w-7xl items-center justify-between gap-4 px-4 py-4 sm:px-6 lg:px-8">
          <a href="#/" class="text-xl font-extrabold tracking-tight text-red-500">PokéPlay</a>
          <nav class="flex items-center gap-2 text-sm font-semibold sm:gap-3">
            <a class="nav-link rounded-full px-3 py-1.5 hover:bg-slate-100 dark:hover:bg-slate-800" href="#/">Inicio</a>
            <a class="nav-link rounded-full px-3 py-1.5 hover:bg-slate-100 dark:hover:bg-slate-800" href="#/battle">Batalla</a>
            <a class="nav-link rounded-full px-3 py-1.5 hover:bg-slate-100 dark:hover:bg-slate-800" href="#/pokedex">Mi Pokédex</a>
            <button id="dark-toggle" class="rounded-full border border-slate-300 px-3 py-1.5 transition hover:scale-105 dark:border-slate-600" type="button">🌙</button>
          </nav>
        </div>
      </header>
      <main id="app" class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8"></main>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
